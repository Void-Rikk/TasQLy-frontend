<!doctype html>
<html lang="ru">
    <head>
        <script>
            (function () {
                const theme = localStorage.getItem('app-theme');
                try {
                    const parsed = JSON.parse(theme);
                    if (parsed?.state?.theme === 'light') {
                        document.body.classList.add('light');
                    }
                } catch (e) {}
            })();
        </script>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="Fullstack Task Tracker" />
        <link href="src/shared/ui/icons/GraphQL.png" rel="icon">

        <meta property="og:type" content="website" />
        <meta property="og:title" content="TasQLy" />
        <meta property="og:description" content="Full-stack task tracker, built with NestJS, GraphQL, Prisma, and React" />
        <meta property="og:image" content="https://tasqly-nine.vercel.app/og-image.png" />
        <meta property="og:url" content="https://tasqly-nine.vercel.app/" />

        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="TasQLy" />
        <meta name="twitter:description" content="Full-stack task tracker, built with NestJS, GraphQL, Prisma, and React " />
        <meta name="twitter:image" content="https://tasqly-nine.vercel.app/og-image.png" />

        <title>TasQLy</title>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="src/app/main.tsx"></script>
    </body>
</html>
